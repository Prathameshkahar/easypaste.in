<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyPaste - PrivatePaste</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="pb-dark">
    <div class="container-fluid px-3 px-lg-4 py-3">
      <header class="pb-toolbar card border-0 shadow-sm">
        <div class="card-body py-2">
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <a class="btn btn-outline-light btn-sm" href="index.html">New</a>

            <select id="expiry" class="form-select form-select-sm toolbar-select" aria-label="Expiry">
              <option value="1h">Expire: 1 hour</option>
              <option value="1d" selected>Expire: 1 day</option>
              <option value="1w">Expire: 1 week</option>
              <option value="1m">Expire: 1 month</option>
              <option value="never">Expire: Never</option>
            </select>

            <div class="form-check form-switch text-nowrap ms-1">
              <input class="form-check-input" type="checkbox" id="burnAfterRead" />
              <label class="form-check-label" for="burnAfterRead">Burn after reading</label>
            </div>

            <input type="password" id="password" class="form-control form-control-sm toolbar-input" placeholder="Password (optional)" />

            <button id="attachBtn" class="btn btn-outline-light btn-sm" type="button">Attach file</button>
            <input id="fileInput" type="file" class="d-none" />

            <select id="format" class="form-select form-select-sm toolbar-select" aria-label="Format">
              <option value="plain" selected>Plain Text</option>
              <option value="markdown">Markdown</option>
              <option value="code">Code</option>
            </select>

            <button id="toggleMode" class="btn btn-outline-light btn-sm" type="button">Dark mode</button>

            <select id="theme" class="form-select form-select-sm toolbar-select" aria-label="Theme">
              <option value="dark" selected>Dark</option>
              <option value="light">Light</option>
            </select>

            <button id="createBtn" class="btn btn-primary btn-sm ms-auto" type="button">Create Private Paste</button>
          </div>
        </div>
      </header>

      <main class="mt-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <div class="card-header bg-transparent border-secondary-subtle">
            <ul class="nav nav-tabs card-header-tabs" id="editorTabs">
              <li class="nav-item">
                <button class="nav-link active" data-tab="editor" type="button">Editor</button>
              </li>
              <li class="nav-item">
                <button class="nav-link" data-tab="preview" type="button">Preview</button>
              </li>
            </ul>
          </div>
          <div class="card-body p-0">
            <section id="editorPanel">
              <textarea id="editor" class="form-control paste-editor border-0" spellcheck="false" placeholder="Write your encrypted paste here..."></textarea>
              <div id="dropZone" class="drop-zone text-center small py-2">Drag &amp; drop file here (max 5MB)</div>
              <div id="attachmentInfo" class="attachment-info px-3 py-2 d-none"></div>
            </section>
            <section id="previewPanel" class="d-none">
              <div id="preview" class="preview-area p-3"></div>
            </section>
          </div>
        </div>

        <div id="resultBox" class="card border-0 shadow-sm mt-3 d-none">
          <div class="card-body">
            <p class="mb-2">Paste created successfully. Share this secure link:</p>
            <div class="input-group">
              <input id="shareLink" class="form-control" readonly />
              <button id="copyLinkBtn" class="btn btn-primary" type="button">Copy link</button>
            </div>
            <div class="d-flex flex-wrap align-items-start gap-3 mt-3">
              <button id="copyPasteBtn" class="btn btn-outline-light btn-sm" type="button">Copy paste text</button>
              <div id="qrCode" class="qr-wrap"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
  </body>
</html>
