<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyPaste - View Private Paste</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="pb-dark">
    <div class="container py-4">
      <header class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">PrivatePaste</h1>
        <a href="index.html" class="btn btn-outline-light btn-sm">New</a>
      </header>

      <div id="statusAlert" class="alert alert-secondary">Loading paste…</div>

      <section id="passwordSection" class="card border-0 shadow-sm mb-3 d-none">
        <div class="card-body">
          <label for="viewPassword" class="form-label">Password required</label>
          <div class="input-group">
            <input id="viewPassword" type="password" class="form-control" placeholder="Enter password" />
            <button id="unlockBtn" class="btn btn-primary" type="button">Unlock</button>
          </div>
        </div>
      </section>

      <section id="pasteSection" class="card border-0 shadow-sm d-none">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span id="pasteMeta" class="small text-secondary"></span>
          <button id="copyContentBtn" class="btn btn-outline-light btn-sm" type="button">Copy</button>
        </div>
        <div class="card-body">
          <pre id="plainContainer" class="mb-0 d-none"></pre>
          <div id="markdownContainer" class="markdown-body d-none"></div>
          <pre id="codeContainer" class="mb-0 d-none"><code class="language-javascript" id="codeContent"></code></pre>
          <div id="fileContainer" class="mt-3 d-none">
            <h2 class="h6">Attachment</h2>
            <a id="downloadFile" class="btn btn-primary btn-sm" download>Download file</a>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
  </body>
</html>
